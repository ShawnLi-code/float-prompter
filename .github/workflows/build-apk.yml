name: Build and Release FloatPrompter APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="v1.0.3"; fi
          cp app/build/outputs/apk/release/app-release.apk "release_output/FloatPrompter-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk release_output/FloatPrompter-release.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatPrompter-Release-APK
          path: release_output/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.3' }}
          name: 流光提词 (FloatPrompter) ${{ github.ref_name || 'v1.0.3' }} (OPPO ColorOS 专项修复 · 悬浮小球零闪退 · 一键权限自检)
          body: |
            ### 🎙️ 流光提词 (FloatPrompter) ${{ github.ref_name || 'v1.0.3' }} 深度修复版本

            本次更新专门针对真实 OPPO Find X (ColorOS 14) 及定制 Android 系统的悬浮窗弹出问题进行了终极底层排查与修复：

            #### 🌟 v1.0.3 核心底层修复：
            1. **🛠️ 修复 Service 内部 InflateException 隐形闪退（关键根因）**：
               - 排查发现悬浮窗布局使用了依赖 Activity 样式的属性，导致 Service 加载布局时抛出隐形异常闪退；
               - 现已全面使用 `ContextThemeWrapper` 并在悬浮布局中彻底剥离所有主题依赖属性，**确保悬浮球与大窗 100% 稳妥加载上屏**！
            2. **⏱️ 消除 WindowManager 视图加载竞态**：
               - 移除 `onCreate()` 中与 `onStartCommand()` 的连续挂载冲突，严密按需显示悬浮球或提词窗。
            3. **⚙️ 新增「OPPO / 小米系统权限自检」直达通道**：
               - 主界面底部增加快捷引导，一键直达系统【权限管理】，帮助确认「悬浮窗」与「后台弹出界面」两项权限。
            4. **📸 手机原厂原配专业相机精准直达**：
               - 支持 OPPO 哈苏超光影相机、小米徕卡、vivo 蔡司等原生 4K/60fps、美颜与滤镜录像。
          files: |
            release_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
