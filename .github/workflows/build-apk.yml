name: Build and Release FloatPrompter APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="v1.0.3"; fi
          cp app/build/outputs/apk/release/app-release.apk "release_output/FloatPrompter-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk release_output/FloatPrompter-release.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatPrompter-Release-APK
          path: release_output/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.4' }}
          name: 流光提词 (FloatPrompter) ${{ github.ref_name || 'v1.0.4' }} (整句断句不拆散 · 35%透明度触控修复 · 历史稿件库 · 编辑框滑动)
          body: |
            ### 🎙️ 流光提词 (FloatPrompter) ${{ github.ref_name || 'v1.0.4' }} 正式更新

            本次更新针对口播创作者的使用节奏与操作体验进行了全方位深度升级：

            #### 🌟 v1.0.4 核心功能与体验升级：
            1. **⚡ 自然整句智能排版（一句话讲完才换行，逗号顿号不拆碎）**：
               - 彻底解决句子被逗号切成碎片、读得断断续续的问题；
               - 仅在句号、问号、感叹号、分号等自然语句结束时才换行，语句连贯、节奏顺畅！
            2. **🖱️ 35% 极低透明度可点击修复（彻底解决 Android 12+ 触控屏蔽）**：
               - 深入修复 Android 12/13/14 `LayoutParams.alpha < 0.4` 触发的 Tapjacking 触控拦截机制；
               - 改由背景色单独控制毛玻璃透明度，35%/65%/92% 任意透明度下，**所有按钮、拖动抓手与滚屏完全畅通可点**！
            3. **💾 新增「保存稿件」与「📚 历史稿件库」**：
               - 支持为稿件自定义标题保存，统计字数、预估用时与保存时间；
               - 随时打开历史稿件库一键载入提词或管理删除，多篇脚本随时调取！
            4. **📜 台词编辑框独立内部滑动优化**：
               - 解决编辑长篇稿件时被外层页面拦截的问题，长文案上下随心滑动、编辑无拘束。
            5. **✨ 澄清《6个月法则》示例与国内语音引擎**：
               - 不再强制默认载入示例脚本，仅保留用户真实编辑的内容；
               - 界面清晰提示国产手机 ROM（OPPO/小米等）无谷歌语音识别引擎的现状，主推稳定丝滑的【定时匀速滚屏】。
          files: |
            release_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
