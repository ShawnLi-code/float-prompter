name: Build and Release FloatPrompter APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/FloatPrompter-v1.0.0.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatPrompter-v1.0.0-APK
          path: release_output/FloatPrompter-v1.0.0.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: 流光提词 (FloatPrompter) v1.0.0 (口播创作者专属 · 窄窗悬浮 · 语音跟读)
          body: |
            ### 🎙️ 流光提词 (FloatPrompter) v1.0.0 正式发布

            专门为短视频/小红书/口播创作者量身打造的高效手机悬浮提词器！

            #### ✨ 核心功能亮点：
            1. **🪟 自由拖拽与屏幕吸附**：
               - 支持悬浮在系统原生相机前面，手指触摸随心拖拽，紧贴前置摄像头；
            2. **🕶️ 动态透明度调节**：
               - 随时切换 35%、65%、90% 半透明磨砂底色，既能看清自己的表情，也能看清台词；
            3. **⚡ 智能长文断句与窄窗排版**：
               - 粘贴长文后一键整理，自动过滤无用舞台括号，切分为每行 8~12 字的黄金视线窄句，**彻底解决录口播眼球左右乱晃的尴尬**；
            4. **⏱️ 双模滚屏（匀速调速 + 麦克风语音跟读）**：
               - 支持 1~10 档平滑滚屏，或开启麦克风读到哪高亮滚到哪；
            5. **✨ 内置《6个月法则与结果延迟性》爆款脚本**：
               - 开箱即用，一键载入即可开机录制。
          files: |
            release_output/FloatPrompter-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
