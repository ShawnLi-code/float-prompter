name: Build and Release FloatPrompter APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="v1.0.2"; fi
          cp app/build/outputs/apk/release/app-release.apk "release_output/FloatPrompter-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk release_output/FloatPrompter-release.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatPrompter-Release-APK
          path: release_output/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.2' }}
          name: 流光提词 (FloatPrompter) ${{ github.ref_name || 'v1.0.2' }} (原厂高清相机适配 · 悬浮球防闪退修复 · UI排版全面优化)
          body: |
            ### 🎙️ 流光提词 (FloatPrompter) ${{ github.ref_name || 'v1.0.2' }} 修复与深度优化发布

            针对真实机型反馈进行了全面修复与排版美化：

            #### 🌟 v1.0.2 核心更新与修复：
            1. **📸 原厂高清专业相机直达**：
               - 彻底移除系统低画质录像模式，精准适配小米/红米、OPPO/一加、vivo/iQOO、华为、荣耀、三星等厂商原装原配专业相机，支持 4K/60fps、美颜与滤镜！
            2. **🛠️ 悬浮窗/小圆球彻底防闪退修复**：
               - 替换为标准矢量通知图标，解决前台服务 BadNotification 异常；
               - 优化 WindowManager 视口与层级，确保小圆球在屏幕边缘稳定贴靠，点击必出。
            3. **🎨 UI 与排版全面重构**：
               - 解决按钮文字折行重叠、文字与底色冲突问题；
               - 解决长台词文本框与页面滚动冲突，滑动顺畅不卡手；
               - 底部控制区重构为独立主次层级，大按钮清晰易点。
            4. **🔄 应用内无感覆盖升级**：
               - 所有已开启权限与台词草稿 100% 保留，无需重复配置！
          files: |
            release_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
